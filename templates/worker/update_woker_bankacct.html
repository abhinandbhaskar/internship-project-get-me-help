{% extends 'worker/worker_homepage.html' %}
{% block body %}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
    <link rel="stylesheet" href="\static\page_templates\js\gmhpages.css">
</head>

<body>
<div class="container-one">
    <h1 class="Hh">Edit Bank Account Details</h1>
<form action="/worker_upt_bank_dts_post/{{ data.id }}" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <table width="70%" border="2" class="table table-bordered c">
  <tr>
      <th width="52%" scope="row"><div align="center">Bank name:</div></th>
    <td width="48%">
      <input type="text" name="bankname" class="form-control stl" id="textfield" value="{{ data.bank_name }}"  minlength="3" /></td>
  </tr>
  <tr>
      <th scope="row"><div align="center">Account no:</div></th>
    <td>
      <input type="text" name="acctno" id="textfield2" class="form-control" pattern="\d{10,18}" title="Account number should be 10 to 18 digits"  value="{{ data.accnt_no }}"/></td>
  </tr>
  <tr>
      <th scope="row"><div align="center">IFSCcode:</div></th>
    <td>
      <input type="text" name="ifsccode" id="textfield3" class="form-control" pattern="[A-Z]{4}0[A-Z0-9]{6}" title="IFSC code should be in the format ABCD0EFGHIJ" value="{{ data.ifsc_code }}" /></td>
  </tr>
  <tr>
      <th scope="row"><div align="center">Branch name:</div></th>
    <td>
      <input type="text" name="branchname" id="textfield4" class="form-control" minlength="3" value="{{ data.branch_name }}" /></td>
  </tr>
  <tr>
      <th scope="row"><div align="center">Balance</div></th>
    <td>
      <input type="text" name="balance" id="textfield5" class="form-control" pattern="\d+(\.\d{1,2})?" title="Balance should be a number with up to two decimal places" value="{{ data.balance }}" /></td>
  </tr>
  <tr>
      <th colspan="2" scope="row"><div align="center"> <input type="submit" name="button" class="submit-btn" id="button" value="Submit" /></div></th>
    </tr>
</table>
</form>
</div>
</body>
</html>
{% endblock %}
