{% extends 'worker/worker_homepage.html' %}
{% block body %}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
    <link rel="stylesheet" href="\static\page_templates\js\gmhpages.css">
</head>

<body>
<div class="container-one">
       <h1 class="Hh">Edit Your Profile</h1>
<form action="/edit_wrkr_profile_post/{{ data.id }}" method="post" enctype="multipart/form-data">
    {% csrf_token %}
     <div class="table-responsive">
<table width="50%" border="2" class="table table-bordered c">
     <tr>
    <th scope="row" width="40%"><div align="center" style="color: #0d8aff">Edit Image:</div></th>
    <td><label for="textfield"></label>
      <img src="{{ data.image }}" height="100px" width="100px">
      <input type="file" name="image" id="image" accept="image/*" >
    </td>

  </tr>
  <tr>
    <th scope="row"><div align="center">Name:</div></th>
    <td>
      <input type="text" name="name" id="textfield" style="width: 70%" class="form-control" pattern="[A-Za-z\s]+" title="Only alphabets and spaces are allowed" value="{{ data.worker_name }}" required/></td>
  </tr>
  <tr>
    <th scope="row"><div align="center">Email:</div></th>
    <td>
      <input type="text" name="email" style="width: 70%" class="form-control" id="textfield" value="{{ data.email }}" readonly/></td>
  </tr>
  <tr>
    <th scope="row"><div align="center">Phone:</div></th>
    <td>
      <input type="text" name="phone" style="width: 70%" class="form-control" id="textfield" min="10" max="15" value="{{ data.phone }}" pattern="[0-9]{10}" title="Please enter a valid 10-digit phone number" required/></td>
  </tr>

    <th colspan="2" scope="row"><div align="center"><input type="submit" name="button" class="submit-btn" id="button" value="Submit" /></div></th>
    </tr>
</table>
</div>
</form>
</div>
<script type="text/javascript">
   document.getElementById('image').addEventListener('change', function() {
    const file = this.files[0];
    const fileType = file.type;

    // Check if the selected file type is an image
    if (!fileType.startsWith('image/')) {
        alert('Please select an image file.');
        this.value = ''; // Clear the file input
    }
});

</script>
<!-- jQuery and Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
{% endblock %}
