{% extends 'worker/worker_homepage.html' %}
{% block body %}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
    <link rel="stylesheet" href="\static\page_templates\js\gmhpages.css">
</head>

<body>
<div class="container-one">
       <h1 class="Hh">Add Own Services With Amount</h1>
<form action="/add_own_srv_post/{{ data.id }}" method="post" enctype="multipart/form-data">
    {% csrf_token %}
<table width="70%" border="2" class="table table-bordered c">
  <tr class="headings">
    <th scope="row" width="50%">Own serice name</th>
    <td>Amount</td>
  </tr>
  <tr>

    <th scope="row"><div align="center">{{ data.service_name }}</div></th>
    <td>
        <div align="center"><input type="text" name="amount" style="width: 80%" class="form-control" id="textfield" required/></div></td>
  </tr>
  <tr>
      <th colspan="2" scope="row"><div align="center"><input type="submit" class="submit-btn" name="button" id="button" value="Submit" /></div></th>
    </tr>
</table>


</form>
</div>
</body>
</html>
{% endblock %}
