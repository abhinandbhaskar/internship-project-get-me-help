<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Design by foolishdeveloper.com -->
  <title>Glassmorphism Login Form Tutorial in HTML CSS</title>

  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <!--Stylesheet-->
  <style media="screen">
    *,
    *:before,
    *:after {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #e0f7e0;
    }
    .background {
      width: 430px;
      height: 520px;
      position: absolute;
      transform: translate(-50%, -50%);
      left: 50%;
      top: 50%;
    }
    .background .shape {
      height: 200px;
      width: 200px;
      position: absolute;
      border-radius: 50%;
    }
    .shape:first-child {
      background: linear-gradient(
        #1e8449,
        #89ba16
      );
      left: -80px;
      top: -80px;
    }
    .shape:last-child {
      background: linear-gradient(
        to right,
        #27ae60,
        #89ba16
      );
      right: -30px;
      bottom: -80px;
    }
    form {
      height: 520px;
      width: 400px;
      background-color: rgba(255, 255, 255, 0.85);
      position: absolute;
      transform: translate(-50%, -50%);
      top: 50%;
      left: 50%;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.2);
      padding: 50px 35px;
    }
    form * {
      font-family: 'Poppins', sans-serif;
      color: #333333;
      letter-spacing: 0.5px;
      outline: none;
      border: none;
    }
    form h3 {
      font-size: 32px;
      font-weight: 500;
      line-height: 42px;
      text-align: center;
      color: #89ba16;
    }
    label {
      display: block;
      margin-top: 30px;
      font-size: 16px;
      font-weight: 500;
    }
    input {
      display: block;
      height: 50px;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 3px;
      padding: 0 10px;
      margin-top: 8px;
      font-size: 14px;
      border: solid 1px rgba(199, 191, 191, 0.8);
      font-weight: 300;
    }
    ::placeholder {
      color: #666666;
    }
    button {
      margin-top: 50px;
      width: 100%;
      background-color: #89ba16;
      color: #ffffff;
      padding: 15px 0;
      font-size: 18px;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
    }
    .links {
      margin-top: 30px;
      display: flex;
      justify-content: space-between;
    }
    .links a {
      color: #89ba16;
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="background">
    <div class="shape"></div>
    <div class="shape"></div>
  </div>
  <form action="/loginn_post" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <h3>Login Here</h3>

    <label for="username">Username</label>
    <input type="text" placeholder="email id" pattern="^[a-zA-Z0-9](\.?[a-zA-Z0-9]){5,29}@gmail\.com$" title="username need minimum 6  charachers" name="username" id="username">

    <label for="password">Password</label>
    <input type="password" placeholder="Password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" name="password" id="password">

    <button type="submit">Log In</button>
    <div class="links">
      <a style="font-weight: bold" href="/main_registration">New Registration</a>
{#        <a href="/worker_reg">worker registration</a>#}
{#        <a href="/user_reg">user registration</a>#}
    </div>
  </form>
</body>
</html>
