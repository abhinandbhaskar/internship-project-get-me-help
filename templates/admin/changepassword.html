{% extends 'admin/admin_homepage.html' %}
{% block body %}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
<link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="static\page_templates\js\gmhpages.css">
</head>

<body>

<div class="container-one">
    <h2 class="Hh">Change password</h2>
    <div class="table-responsive">
    <form action="/change_admin_pass_post" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <table width="70%" border="2" class="table table-bordered c">
  <tr>
      {{ data }}
    <th scope="row">Current password:</th>
    <td><label for="textfield"></label>
      <input type="text" name="currentpassword" style="width:70%" placeholder="Currentpassword" class="form-control" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" id="textfield" /></td>
  </tr>
  <tr>
    <th scope="row">New password:</th>
    <td><label for="textfield2"></label>
      <input type="password" name="newpassword"  style="width:70%" placeholder="Newpassword" class="form-control" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" id="textfield2" /></td>
  </tr>
  <tr>
    <th scope="row">Confirm password:</th>
    <td><label for="textfield3"></label>
      <input type="password" name="confirmpassword"  style="width:70%" placeholder="Confirmpassword" class="form-control" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" id="textfield3" /></td>
  </tr>
  <tr>
    <th colspan="2" scope="row"><input type="submit" class="btn btn-primary" name="button" id="button" value="Submit" /></th>
    </tr>
</table>
</form>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
{% endblock %}
