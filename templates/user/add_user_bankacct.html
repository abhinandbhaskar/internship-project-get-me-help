{% extends 'user/user_homepage.html' %}
{% block body %}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>
    <!-- Bootstrap CSS -->
<link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
    <link rel="stylesheet" href="static\page_templates\js\gmhpages.css">
</head>

<body>
<div class="container-one">
       <h2 class="Hh"> Add Your Bank Account</h2>
<form action="/add_bank_account_post" method="post" enctype="multipart/form-data">
    {% csrf_token %}
      <div class="table-responsive">
    <table width="70%" border="2" class="table table-bordered c">
  <tr>
      <th width="52%" scope="row"><div align="center">Bank name:</div></th>
    <td width="48%">
      <input type="text" class="form-control" name="bankname" id="textfield" minlength="3" required /></td>
  </tr>
  <tr>
      <th scope="row"><div align="center">Account Number:</div></th>
    <td>
      <input type="text" name="acctno"  class="form-control"  id="textfield2" pattern="\d{10,18}" title="Account number should be 10 to 18 digits"   required/></td>
  </tr>
  <tr>
      <th scope="row"><div align="center">IFSC code:</div></th>
    <td>
      <input type="text" name="ifsccode"  class="form-control"  id="textfield3" pattern="[A-Z]{4}0[A-Z0-9]{6}" title="IFSC code should be in the format ABCD0EFGHIJ" required /></td>
  </tr>
  <tr>
      <th scope="row"><div align="center">Branch name:</div></th>
    <td>
      <input type="text" name="branchname"  class="form-control"  id="textfield4" minlength="3" required /></td>
  </tr>
  <tr>
      <th scope="row"><div align="center">Balance</div></th>
    <td>
      <input type="text" name="balance"  class="form-control"  id="textfield5" required pattern="\d+(\.\d{1,2})?" title="Balance should be a number with up to two decimal places"  /></td>
  </tr>
  <tr>
      <th colspan="2" scope="row"><div align="center"><input type="submit" class="submit-btn" name="button" id="button" value="Submit" /></div></th>
    </tr>
</table>
</div>
</form>
</div>
<!-- jQuery and Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
{% endblock %}
