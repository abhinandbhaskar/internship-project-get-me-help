{% extends 'user/user_homepage.html' %}
{% block body %}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
     <link rel="stylesheet" href="\static\page_templates\js\gmhpages.css">
</head>

<body>
<div class="container-one">
<h1 class="Hh">Edit User Profile</h1>
<form action="/edit_user_profile_post/{{ data.id }}" method="post" enctype="multipart/form-data">
    {% csrf_token %}
<div class="table-responsive">
<table width="70%" border="2" class="table table-bordered c">
      <tr>
          <th scope="row" width="30%"><div align="center" style="color: #007bff">Edit Image:</div></th>
    <td><label for="textfield"></label>
        <img src="{{ data.image }}" height="160px" width="200px">
      <input type="file"  accept="image/*" name="image" id="image" /></td>
  </tr>
  <tr>
      <th scope="row"><div align="center"> Name:</div></th>
    <td>
      <input type="text" name="name" style="width: 65%" class="form-control" pattern="[A-Za-z\s]+" title="Only alphabets and spaces are allowed"  placeholder="Enter your name" id="textfield" value="{{ data.name }}" required/></td>
  </tr>
  <tr>
      <th scope="row"><div align="center">Place:</div></th>
    <td>
      <input type="text" name="place"  style="width: 65%" class="form-control" pattern="[A-Za-z\s]+" title="Only alphabets and spaces are allowed"  placeholder="Enter your place" id="textfield" value="{{ data.place }}" required/></td>
  </tr>
  <tr>
      <th scope="row"><div align="center">Pin:</div></th>
    <td>
      <input type="text" name="pin" min="6" max="6" style="width: 65%" class="form-control" pattern="[0-9]{6}" title="Enter the 6 digit pincode" id="textfield" value="{{ data.pin }}" required/></td>
  </tr>
  <tr>
      <th scope="row"><div align="center">Post</div></th>
    <td>
      <input type="text" name="post"  class="form-control" style="width: 65%"  id="textfield" value="{{ data.post }}" required/></td>
  </tr>
  <tr>
      <th scope="row"><div align="center">Email:</div></th>
    <td>
      <input type="text" name="email"  class="form-control" style="width: 65%" id="textfield" value="{{ data.email }}" readonly/></td>
  </tr>
  <tr>
      <th scope="row"><div align="center">Phone:</div></th>
    <td>
      <input type="text" name="phone" id="textfield"  class="form-control"  style="width: 65%" pattern="[0-9]{10}" title="Please enter a valid 10-digit phone number" value="{{ data.phone }}" required/></td>
  </tr>
  <tr>
  <tr>
    <th colspan="2" scope="row"><div align="center"> <input type="submit" class="submit-btn" name="button" id="button" value="Submitt" /></div></th>
    </tr>
</table>
</div>
</form>
</div>
{#<script type="text/javascript" src="/static/page_templates/js/gmhjs.js"></script>#}
<script src="/static/page_templates/js/gmhjs.js"></script>
<script type="text/javascript">

document.getElementById('image').addEventListener('change',function(){
    const file = this.files[0];
    const fileType = file.type;
    if (!fileType.startsWith('image/')){
        alert('please select an image file.');
        this.value = '';
    }
});
</script>
<!-- jQuery and Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
{% endblock %}
