{% extends 'user/user_homepage.html' %}
{% block body %}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>

    <script type="text/javascript">
        var xmlHttp;
            function adds(eid){
{#                alert(eid);#}
                if (typeof XMLHttpRequest != "undefined"){
                xmlHttp= new XMLHttpRequest();
                }
                else if (window.ActiveXObject){
                    xmlHttp= new ActiveXObject("Microsoft.XMLHTTP");
                }
                if (xmlHttp==null){
                    alert("Browser does not support XMLHTTP Request")
                    return;
                }
                var url="/make_payment/"+eid+"/";
                url += {{ amnt }}
                xmlHttp.onreadystatechange = stateChange;
                xmlHttp.open("GET", url, true);
                xmlHttp.send(null);
            }

            function stateChange(){
                if(xmlHttp.readyState==4 || xmlHttp.readyState=="complete"){
                    document.getElementById("sub").innerHTML=xmlHttp.responseText

                }
            }
</script>
<link rel="stylesheet" href="/static/page_templates/js/gmhpages.css">
</head>

<body>
<div class="container-one">
    <h1 class="Hh">Select Bank Account</h1>
<p>&nbsp;</p>
<form id="form1" name="form1" method="post" action="/make_payment_post">
<table width="70%" border="2" class="table table-bordered c">
  <tr class="headings" >
    <th scope="row">Select:</th>
    <td><label for="select"></label>
      <select name="select" id="select" onchange="adds(value)">
      <option>select your bank</option>
          {% for i in data2 %}
          <option value="{{ i.id }}">{{ i.bank_name }}</option>
          {% endfor %}
      </select></td>
  </tr>

</table>

<div id="sub">

</div>

</form>
<p>&nbsp;</p>
</div>
</body>
</html>
{% endblock %}
